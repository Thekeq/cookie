# nginx перед приложением. Кладётся в /etc/nginx/conf.d/cookie.conf.
#
# Здесь только то, что нужно канареечной выкладке и корректной работе метрик.
# Апстрим лежит В ОТДЕЛЬНОМ ФАЙЛЕ (cookie-upstream.conf) — его переписывает
# deploy/canary.py, и держать его вместе с остальным конфигом означало бы, что
# скрипт правит файл, который человек тоже правит руками.
#
# Заголовки безопасности — тоже отдельным файлом (cookie-security.conf, лежит
# рядом в deploy/nginx-security-headers.conf). Причина в самом nginx: add_header
# не складывается, а замещается, поэтому каждый location обязан подключить их
# сам. Файл вместо копипасты — чтобы политика была одна, а не четыре.
#
# Начальное содержимое cookie-upstream.conf (канарейки нет, весь трафик парку):
#
#     upstream cookie_app {
#         server 127.0.0.1:8000 weight=100 max_fails=3 fail_timeout=10s;
#         keepalive 32;
#     }

server {
    listen 443 ssl http2;
    server_name cookie.example.com;

    ssl_certificate     /etc/letsencrypt/live/cookie.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cookie.example.com/privkey.pem;

    # Тело запроса приложение и так ограничивает 64 КБ, но проверять это после
    # того, как мегабайт уже принят и разобран, поздно: сначала фильтр здесь.
    #
    # Одного client_max_body_size мало: он смотрит на Content-Length, а запрос с
    # Transfer-Encoding: chunked заголовка длины не имеет вовсе. Ограничение по
    # ФАКТИЧЕСКОМУ потоку даёт proxy_request_buffering: nginx дочитывает тело
    # сам и упирается в лимит на чтении, а не на объявленной длине. Ценой
    # задержки на буферизацию — тела здесь килобайтные, это ничего не стоит.
    client_max_body_size 128k;
    client_body_buffer_size 128k;
    proxy_request_buffering on;

    # Заголовки безопасности приложение ставит и само (main.py,
    # security_headers) — здесь они не дубль, а замена: proxy_hide_header
    # снимает версию апстрима, include ставит нашу. Без hide браузер получил бы
    # ДВА заголовка CSP, а две политики применяются как пересечение — сложить их
    # в голове при отладке нельзя.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;

    # Идентификатор запроса ставит прокси, приложение его подхватывает
    # (obs.new_request_id) и пишет в каждую строку лога. Без этого история
    # одного нажатия кнопки собирается по времени и на глаз.
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Тап игрока должен либо пройти, либо честно упасть. Долгое ожидание хуже
    # отказа: клиент повторит батч, а сервер посчитает его дважды — от этого
    # спасает X-Op-Id, но проверять его на каждом таймауте незачем.
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # Повтор на соседний сервер апстрима — то, ради чего канарейка вообще
    # безопасна: упавшая канарейка отдаёт запрос парку, а не игроку. Только для
    # запросов, которые НЕ успели попасть в обработку: повторять POST, который
    # сервер уже принял и начал считать, нельзя.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # Собранная статика раздаётся С ДИСКА, мимо приложения. Через proxy_pass
    # её отдавал бы StaticFiles внутри FastAPI: заранее сжатые .br не
    # использовались бы вовсе, а Cache-Control не выставлялся, и браузер ходил
    # бы за одним и тем же бандлом каждую сессию.
    #
    # immutable здесь безопасен ровно потому, что имя файла содержит хеш
    # содержимого (assets) или версию семейства (fonts): изменилось содержимое —
    # изменилось имя, старый ответ никому не мешает. Ставить immutable на файл
    # со стабильным именем нельзя — год в кеше не отзывается.
    #
    # brotli_static требует модуль ngx_brotli. Его нет — строку убрать, .br
    # просто не задействуются, всё остальное работает.
    location ^~ /assets/ {
        root /opt/cookie/webapp/dist;
        brotli_static on;
        gzip_static on;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include conf.d/cookie-security.conf;
    }

    location ^~ /fonts/ {
        root /opt/cookie/webapp/dist;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include conf.d/cookie-security.conf;
    }

    location / {
        # index.html кешировать нельзя: в нём лежат ссылки на хешированные
        # бандлы, и закешированный старый index указывает на файлы, которых
        # после выкладки уже нет — это белый экран, а не устаревшая версия.
        proxy_pass http://cookie_app;
        include conf.d/cookie-security.conf;
    }

    # Метрики наружу не отдаём вовсе. Токен на них есть, но выгрузка — это
    # карта сервиса, и единственный, кому она нужна, ходит с самой машины.
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://cookie_app;
        include conf.d/cookie-security.conf;
    }

    # Проверки состояния мимо балансировки: спрашивать «готов ли ты» у
    # случайного из двух процессов бессмысленно — ответ будет про другого.
    location = /readyz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
        include conf.d/cookie-security.conf;
    }
    location = /livez {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
        include conf.d/cookie-security.conf;
    }
}

server {
    listen 80;
    server_name cookie.example.com;
    return 301 https://$host$request_uri;
}
