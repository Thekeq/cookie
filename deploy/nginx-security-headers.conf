# Заголовки безопасности. Кладётся в /etc/nginx/conf.d/cookie-security.conf и
# подключается через include из КАЖДОГО location в cookie.conf.
#
# Почему отдельным файлом, а не один раз в server{}. В nginx add_header не
# складывается, а ЗАМЕЩАЕТСЯ: location со своим add_header отменяет все
# add_header уровня выше целиком. Блоки статики выставляют Cache-Control —
# значит, серверные заголовки безопасности до них бы не дошли, и ровно те
# ответы, что раздаются мимо приложения, ушли бы голыми. Один include в каждом
# location стоит трёх копий политики, разъезжающихся по одной за раз.
#
# Список обязан совпадать с CSP/HSTS в main.py (security_headers). Разъехались —
# выигрывает nginx, и приложение об этом не узнает.

# always — иначе заголовки не попадут в ответы с кодом ошибки, а 4xx/5xx это
# ровно те ответы, где чужой скрипт на странице опаснее всего.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
# frame-ancestors вместо X-Frame-Options: DENY — Telegram открывает Mini App в
# своём iframe, DENY убил бы веб-версию клиента целиком.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; frame-ancestors https://telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;
