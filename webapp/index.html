<!doctype html>
<!-- lang проставляется из активной локали в App.tsx (loadLang по умолчанию 'en') -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Зум НЕ запрещаем: maximum-scale/user-scalable=no ломает доступность
         для слабовидящих. viewport-fit=cover — под safe-area в вебвью. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cookie Merge</title>
    <meta name="theme-color" content="#17100a" />
    <!-- Шрифты self-hosted: public/fonts + @font-face в styles.css. Здесь
         предзагружаем только латиницу обоих семейств — она нужна всегда
         (цифры баланса, ценники), а язык UI лежит в localStorage и на этапе
         парсинга HTML ещё неизвестен. Кириллица Rubik приедет следом за CSS,
         с font-display: swap это отрисовку не задерживает. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/rubik-v31-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/baloo2-v23-latin.woff2" crossorigin />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
