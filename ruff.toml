# Статический разбор. Набор правил намеренно узкий.
#
# Смысл линтера здесь — ловить то, что ломается в РАНТАЙМЕ и только у игрока:
# опечатку в имени переменной внутри редкой ветки, забытый импорт, f-строку без
# подстановки. Такие вещи тесты видят, только если в эту ветку кто-то зашёл.
#
# Стилевые правила (длина строки, порядок импортов, кавычки) не включены: они
# дают шум на каждой строке существующего кода и приучают глушить линтер, после
# чего он перестаёт ловить и настоящее.
line-length = 100

[lint]
select = [
    "F",     # pyflakes: неопределённые имена, неиспользуемые импорты и переменные
    "E9",    # синтаксис и отступы, из-за которых модуль вообще не импортируется
    "B",     # bugbear: мутабельный аргумент по умолчанию, except без привязки
    "S",     # bandit: небезопасные вызовы (см. исключения ниже)
    "UP",    # устаревшие конструкции, которые ломаются на новых версиях
]
ignore = [
    "B008",  # Depends(...) в сигнатуре — это и есть способ объявить зависимость FastAPI
    "B905",  # zip(strict=) — обвязка на каждый zip ради версии, которой у нас нет
    "B904",  # raise ... from: игровые ручки переводят ValueError в HTTPException с
             # кодом ошибки для интерфейса, и цепочка исключений в ответе не нужна
    "S101",  # assert: тесты написаны на нём
    "S104",  # HOST по умолчанию 0.0.0.0 — процесс живёт за обратным прокси
    "S105",  # «похоже на пароль» — срабатывает на именах полей и константах
    "S106",
    "S311",  # random: им считается спавн предметов, а не ключи
    "S603",  # subprocess: зовём его со своим же списком аргументов
    "S607",  # pg_dump ищется в PATH — так и задумано
    # S608 ловит любую СБОРКУ строки запроса, но в этом коде подставляются только
    # свои же идентификаторы: имена колонок из CURRENCY_COLUMN, список таблиц из
    # схемы, плейсхолдеры «?» по числу элементов. Значения ВСЕГДА идут
    # параметрами — за этим следит db.py, который сам переписывает ? в %s. Правило
    # даёт три десятка ложных срабатываний и ни одного настоящего.
    "S608",
]

[lint.per-file-ignores]
# Проверки поднимают серверы, дёргают подпроцессы и подсовывают заглушки —
# требовать от них того же, что от боевого кода, значит переписать их ради
# линтера
"test_*.py" = ["S", "B", "F841"]
"balance_sim.py" = ["S", "B"]
"simplay.py" = ["S", "B"]
